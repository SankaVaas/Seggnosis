[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seggnosis"
version = "0.2.1"
description = "Model-agnostic uncertainty quantification and OOD detection for image segmentation models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sanka Vaas Samarasingha" }]
keywords = [
    "deep-learning", "computer-vision", "medical-imaging", "segmentation",
    "uncertainty-quantification", "out-of-distribution-detection", "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=1.10",
    "numpy>=1.20",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/SankaVaas/seggnosis"
Issues = "https://github.com/SankaVaas/seggnosis/issues"

[tool.setuptools.packages.find]
include = ["seggnosis*"]